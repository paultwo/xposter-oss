name: lint and test

on:
  pull_request:
  push:

# Read-only token. CI uses no secrets, so fork pull requests get nothing extra.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans every commit, so it needs the full history.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fonts
      - run: npm run types
      - run: npx biome check .
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --log-opts=--all --config .gitleaks.toml --redact --no-banner --exit-code 1 .
